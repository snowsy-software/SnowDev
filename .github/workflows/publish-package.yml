name: 发布 npm 公共包

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 输入 PUBLISH 以确认发布当前 package.json 中的版本
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: inputs.confirm_publish == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run pack:check
      - run: npm publish
