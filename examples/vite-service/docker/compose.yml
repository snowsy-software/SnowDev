services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./:/app

  web-test:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm test"]
    volumes:
      - ./:/app
    profiles: ["test"]
